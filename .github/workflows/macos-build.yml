name: macOS distribution
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing published release tag; leave empty for artifacts only'
        type: string
        required: false
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: node scripts/verify-release.ts
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
      - name: Check destination release before building
        if: inputs.release_tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
      - run: npm ci
      - run: npm run build:mac
      - name: Verify packaged macOS application
        run: |
          export ASKOD_E2E_EXECUTABLE="$(python3 -c 'from pathlib import Path; print(next(Path("release/mac").glob("*/ASKOD Reports.app/Contents/MacOS/ASKOD Reports")).resolve())')"
          npm run test:e2e -- smoke.spec.ts reports.spec.ts
          APP_BUNDLE="$(python3 -c 'from pathlib import Path; print(next(Path("release/mac").glob("*/ASKOD Reports.app")).resolve())')"
          codesign --verify --deep --strict "$APP_BUNDLE"
      - uses: actions/upload-artifact@v4
        with:
          name: askod-reports-mac-${{ runner.arch }}
          path: |
            release/mac/*.dmg
            release/mac/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: packaging-diagnostics-mac
          path: .data/e2e/
          include-hidden-files: true
  publish:
    needs: package
    if: inputs.release_tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ inputs.release_tag }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          pattern: askod-reports-mac-*
          merge-multiple: true
          path: release-assets
      - run: node scripts/publish-release.ts release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_EXISTING_ONLY: 'true'
