name: Windows and Ubuntu distributions
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to publish (e.g. v0.1.1); leave empty for artifacts only'
        type: string
        required: false
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows
            executable: release/windows/win-unpacked/ASKOD Reports.exe
          - os: ubuntu-24.04
            target: ubuntu
            executable: release/ubuntu/linux-unpacked/askod-reports
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: node scripts/verify-release.ts
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
      - run: npm ci
      - run: npm run build:${{ matrix.target }}
      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - name: Verify packaged Windows application
        if: runner.os == 'Windows'
        run: npm run test:e2e -- smoke.spec.ts reports.spec.ts
        env:
          ASKOD_E2E_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
      - name: Verify packaged Linux application
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:e2e -- smoke.spec.ts reports.spec.ts
        env:
          ASKOD_E2E_EXECUTABLE: ${{ github.workspace }}/${{ matrix.executable }}
      - uses: actions/upload-artifact@v4
        with:
          name: askod-reports-${{ matrix.target }}-${{ runner.arch }}
          path: |
            release/${{ matrix.target }}/*.exe
            release/${{ matrix.target }}/*.zip
            release/${{ matrix.target }}/*.AppImage
            release/${{ matrix.target }}/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: packaging-diagnostics-${{ matrix.target }}
          path: .data/e2e/
          include-hidden-files: true
  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v4
        with:
          pattern: askod-reports-*
          merge-multiple: true
          path: release-assets
      - run: node scripts/verify-release.ts
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
      - run: node scripts/publish-release.ts release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
